[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxlibera"
version = "0.1.0"
description = "Open source live transcription and translation for multi-stage conferences, powered by the Gemini Live API."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=2.25",
    "pyyaml>=6",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
voxlibera-server = "voxlibera.server:main"
voxlibera-source = "voxlibera.source:main"

[tool.setuptools.packages.find]
include = ["voxlibera*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
