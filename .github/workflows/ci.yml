name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the minimum in pyproject.toml, 3.12 is the Docker image.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        # No network and no API key needed: the tests use fakes.
        run: python -m pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t voxlibera:ci .
      - name: Starts and answers /healthz with an admin key
        run: |
          docker run -d --name voxlibera -p 8000:8000 \
            -e GEMINI_API_KEY=ci-placeholder -e VOXLIBERA_ADMIN_KEY=ci-admin-key voxlibera:ci
          curl --fail --silent --retry 15 --retry-delay 1 --retry-all-errors http://localhost:8000/healthz
          docker rm -f voxlibera
      - name: Refuses to start without an admin key
        # A timeout (exit 124) means the server started, which is a failure too.
        run: |
          status=0
          output=$(timeout 60 docker run --rm -e GEMINI_API_KEY=ci-placeholder voxlibera:ci 2>&1) || status=$?
          echo "$output"
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ] || ! grep -q "Refusing to start" <<< "$output"; then
            echo "Expected the container to refuse to start on 0.0.0.0 with no admin key (exit $status)." >&2
            exit 1
          fi
