services:
  voxlibera:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}  # put it in a .env file next to this one
      VOXLIBERA_ADMIN_KEY: ${VOXLIBERA_ADMIN_KEY:-}
    volumes:
      - voxlibera-data:/data
      - ./rooms.yaml:/app/rooms.yaml:ro

volumes:
  voxlibera-data:
