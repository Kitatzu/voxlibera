  - Nerdearla
  - OBS
  - SRT
  - VTT
  - Apache
  - open source
  - GitHub
  - Kubernetes
  - Pod
  - deploy
  - cluster
  - API
  - URIs
  - NoSQL
  - open source
  - DevOps
  - LLM
  - Gemini

rooms:
