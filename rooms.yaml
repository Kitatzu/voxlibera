# Rooms (stages) served by this Vox Libera instance.
# Each room gets its own Gemini Live session while a source is connected.
#
# glossary: technical terms and proper names. They are used twice:
#   1. as custom vocabulary for speech recognition (spelling of names, jargon)
#   2. in the translation prompt, where they are kept untranslated
# Keep it short (< 100 terms per room works best). The top-level glossary is shared.

