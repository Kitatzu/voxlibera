<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vox Libera — Live Captions</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 0;
    }

    header {
      position: sticky;
      top: 0;
      background: var(--color-background);
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--color-border);
      z-index: 10;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0;
    }

    .connection-indicator {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--color-text-dimmed);
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-text-dimmed);
    }

    .connection-dot--connected {
      background: var(--color-success);
    }

    .connection-dot--reconnecting {
      background: var(--color-warning);
    }

    .connection-dot--disconnected {
      background: var(--color-error);
    }

    .controls-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 0.6rem;
    }

    .font-size-controls {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-left: auto;
    }

    .font-size-controls button {
      padding: 0.3rem 0.6rem;
      font-weight: 700;
    }

    #picker-view {
      max-width: 480px;
      margin: 2rem auto;
      width: 100%;
    }

    #picker-view h1 {
      font-size: 1.4rem;
    }

    .picker-field {
      margin-bottom: 1rem;
    }

    .picker-field label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 600;
    }

    .picker-field select {
      width: 100%;
      padding: 0.6rem;
    }

    #captions-view {
      display: none;
      flex: 1;
      flex-direction: column;
    }

    #captions-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0 6rem 0;
    }

    .segment {
      margin-bottom: 1.1rem;
      line-height: 1.5;
      font-size: var(--caption-font-size, 20px);
    }

    .segment-time {
      display: block;
      font-size: 0.75rem;
      color: var(--color-text-dimmed);
      margin-bottom: 0.15rem;
    }

    .interim-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      padding: 0.85rem var(--side-gutter);
      font-size: var(--caption-font-size, 20px);
      color: var(--color-text-dimmed);
      font-style: italic;
      max-height: 30vh;
      overflow-y: auto;
    }

    .jump-to-live {
      position: fixed;
      bottom: 5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
    }

    .room-status-line {
      font-size: 0.85rem;
      color: var(--color-text-dimmed);
      margin-top: 0.35rem;
    }

    .download-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.6rem;
    }

    .download-row button {
      font-size: 0.85rem;
      padding: 0.35rem 0.7rem;
    }

    .change-room-link {
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div id="picker-view">
    <h1>Vox Libera</h1>
    <p class="dimmed">Pick a room and a language to see live captions.</p>
    <div id="picker-error" class="banner-error" style="display: none"></div>
    <div class="picker-field">
      <label for="room-select">Room</label>
      <select id="room-select"></select>
    </div>
    <div class="picker-field">
      <label for="language-select">Language</label>
      <select id="language-select"></select>
    </div>
    <button id="join-button" class="primary">Join</button>
  </div>

  <div id="captions-view">
    <header>
      <div class="header-row">
        <p class="header-title" id="room-name-label">Room</p>
        <div class="connection-indicator">
          <span class="connection-dot" id="connection-dot"></span>
          <span id="connection-label">Connecting…</span>
        </div>
      </div>
      <div class="room-status-line" id="room-status-line"></div>
      <div class="controls-row">
        <a class="change-room-link" href="index.html">Change room</a>
        <div class="download-row">
          <button id="download-srt">SRT</button>
          <button id="download-vtt">VTT</button>
          <button id="download-txt">TXT</button>
        </div>
        <div class="font-size-controls">
          <button id="font-decrease" aria-label="Decrease font size">A-</button>
          <button id="font-increase" aria-label="Increase font size">A+</button>
        </div>
      </div>
    </header>

    <div id="captions-scroll">
      <div id="segments-container"></div>
    </div>

    <button id="jump-to-live" class="jump-to-live primary" style="display: none">
      Jump to live
    </button>

    <div id="interim-bar" class="interim-bar" style="display: none"></div>
  </div>

  <script src="common.js"></script>
  <script>
    const FONT_SIZE_STORAGE_KEY = "voxlibera.fontSizePx";
    const MIN_FONT_SIZE_PX = 14;
    const MAX_FONT_SIZE_PX = 40;
    const DEFAULT_FONT_SIZE_PX = 20;
    const SCROLL_NEAR_BOTTOM_THRESHOLD_PX = 80;

    const pickerView = document.getElementById("picker-view");
    const pickerError = document.getElementById("picker-error");
    const roomSelect = document.getElementById("room-select");
    const languageSelect = document.getElementById("language-select");
    const joinButton = document.getElementById("join-button");

    const captionsView = document.getElementById("captions-view");
    const roomNameLabel = document.getElementById("room-name-label");
    const roomStatusLine = document.getElementById("room-status-line");
    const connectionDot = document.getElementById("connection-dot");
    const connectionLabel = document.getElementById("connection-label");
    const captionsScroll = document.getElementById("captions-scroll");
    const segmentsContainer = document.getElementById("segments-container");
    const jumpToLiveButton = document.getElementById("jump-to-live");
    const interimBar = document.getElementById("interim-bar");
    const fontDecreaseButton = document.getElementById("font-decrease");
    const fontIncreaseButton = document.getElementById("font-increase");
    const downloadSrtButton = document.getElementById("download-srt");
    const downloadVttButton = document.getElementById("download-vtt");
    const downloadTxtButton = document.getElementById("download-txt");

    let userScrolledUp = false;
    let currentRoomId = null;
    let currentLanguage = "original";
    let currentRoomName = "";
    let captionsClient = null;

    function readStoredFontSizePx() {
      try {
        const storedValue = localStorage.getItem(FONT_SIZE_STORAGE_KEY);
        const parsedValue = storedValue ? parseInt(storedValue, 10) : DEFAULT_FONT_SIZE_PX;
        if (Number.isNaN(parsedValue)) {
          return DEFAULT_FONT_SIZE_PX;
        }
        return Math.min(MAX_FONT_SIZE_PX, Math.max(MIN_FONT_SIZE_PX, parsedValue));
      } catch (storageError) {
        return DEFAULT_FONT_SIZE_PX;
      }
    }

    function writeStoredFontSizePx(fontSizePx) {
      try {
        localStorage.setItem(FONT_SIZE_STORAGE_KEY, String(fontSizePx));
      } catch (storageError) {
        // Ignore storage failures (private browsing, quota, etc.)
      }
    }

    function applyFontSizePx(fontSizePx) {
      document.documentElement.style.setProperty("--caption-font-size", `${fontSizePx}px`);
    }

    function adjustFontSize(deltaPx) {
      const currentFontSizePx = readStoredFontSizePx();
      const nextFontSizePx = Math.min(
        MAX_FONT_SIZE_PX,
        Math.max(MIN_FONT_SIZE_PX, currentFontSizePx + deltaPx)
      );
      writeStoredFontSizePx(nextFontSizePx);
      applyFontSizePx(nextFontSizePx);
    }

    function getQueryParameters() {
      return new URLSearchParams(location.search);
    }

    function setQueryParameters(roomId, languageCode) {
      const searchParameters = new URLSearchParams();
      searchParameters.set("room", roomId);
      searchParameters.set("lang", languageCode);
      history.replaceState(null, "", `?${searchParameters.toString()}`);
    }

    async function initializePickerView() {
      let roomsData;
      try {
        roomsData = await fetchRooms();
      } catch (fetchError) {
        pickerError.textContent =
          "Could not reach the server. Check your connection and reload.";
        pickerError.style.display = "block";
        return;
      }

      roomSelect.innerHTML = "";
      for (const room of roomsData.rooms) {
        const optionElement = document.createElement("option");
        optionElement.value = room.id;
        optionElement.textContent = room.name;
        roomSelect.appendChild(optionElement);
      }

      languageSelect.innerHTML = "";
      for (const languageCode of roomsData.languages) {
        const optionElement = document.createElement("option");
        optionElement.value = languageCode;
        optionElement.textContent = languageLabel(languageCode);
        languageSelect.appendChild(optionElement);
      }

      const queryParameters = getQueryParameters();
      const requestedRoomId = queryParameters.get("room");
      const requestedLanguage = queryParameters.get("lang");

      if (requestedRoomId && roomsData.rooms.some((room) => room.id === requestedRoomId)) {
        roomSelect.value = requestedRoomId;
      }
      if (requestedLanguage && roomsData.languages.includes(requestedLanguage)) {
        languageSelect.value = requestedLanguage;
      }

      if (requestedRoomId && roomsData.rooms.some((room) => room.id === requestedRoomId)) {
        const selectedRoom = roomsData.rooms.find((room) => room.id === requestedRoomId);
        joinRoom(requestedRoomId, selectedRoom.name, languageSelect.value);
        return;
      }
    }

    joinButton.addEventListener("click", () => {
      const selectedRoomId = roomSelect.value;
      const selectedRoomName = roomSelect.options[roomSelect.selectedIndex].textContent;
      const selectedLanguage = languageSelect.value;
      joinRoom(selectedRoomId, selectedRoomName, selectedLanguage);
    });

    function joinRoom(roomId, roomName, languageCode) {
      currentRoomId = roomId;
      currentRoomName = roomName;
      currentLanguage = languageCode;
      setQueryParameters(roomId, languageCode);

      pickerView.style.display = "none";
      captionsView.style.display = "flex";
      roomNameLabel.textContent = `${roomName} — ${languageLabel(languageCode)}`;

      applyFontSizePx(readStoredFontSizePx());

      captionsClient = new CaptionsClient(roomId);
      captionsClient.onConnectionChanged = handleConnectionChanged;
      captionsClient.onHistoryReplaced = handleHistoryReplaced;
      captionsClient.onSegmentUpserted = handleSegmentUpserted;
      captionsClient.onInterimChanged = handleInterimChanged;
      captionsClient.onStatusChanged = handleStatusChanged;
      captionsClient.connect();
    }

    function handleConnectionChanged(connectionState) {
      connectionDot.className = `connection-dot connection-dot--${
        connectionState === "connected" ? "connected" : connectionState === "reconnecting" ? "reconnecting" : "disconnected"
      }`;
      const labels = {
        connecting: "Connecting…",
        connected: "Connected",
        reconnecting: "Reconnecting…",
        disconnected: "Disconnected",
      };
      connectionLabel.textContent = labels[connectionState] || connectionState;
    }

    function handleStatusChanged(roomStatus) {
      roomStatusLine.textContent = `Room status: ${statusLabel(roomStatus)}`;
    }

    function handleHistoryReplaced(orderedSegments, roomStatus) {
      segmentsContainer.innerHTML = "";
      for (const segment of orderedSegments) {
        segmentsContainer.appendChild(buildSegmentElement(segment));
      }
      handleStatusChanged(roomStatus);
      scrollToLiveIfNeeded(true);
    }

    function handleSegmentUpserted(segment) {
      const existingElement = segmentsContainer.querySelector(
        `[data-segment-id="${segment.id}"]`
      );
      const newElement = buildSegmentElement(segment);
      if (existingElement) {
        existingElement.replaceWith(newElement);
      } else {
        segmentsContainer.appendChild(newElement);
      }
      scrollToLiveIfNeeded(false);
    }

    function buildSegmentElement(segment) {
      const segmentElement = document.createElement("div");
      segmentElement.className = "segment";
      segmentElement.dataset.segmentId = String(segment.id);
      // An empty original means the final transcript merged this sentence into a previous one.
      segmentElement.hidden = !segment.original;

      const timeElement = document.createElement("span");
      timeElement.className = "segment-time";
      timeElement.textContent = `${formatDuration(segment.start)} — ${formatDuration(segment.end)}`;
      segmentElement.appendChild(timeElement);

      const textElement = document.createElement("span");

      if (currentLanguage === "original") {
        textElement.textContent = segment.original;
      } else {
        const translatedText = segment.translations ? segment.translations[currentLanguage] : null;
        if (translatedText) {
          textElement.textContent = translatedText;
        } else {
          textElement.textContent = segment.original;
          textElement.className = "dimmed";
        }
      }

      segmentElement.appendChild(textElement);
      return segmentElement;
    }

    function handleInterimChanged(interimText, interimLanguage) {
      if (!interimText) {
        interimBar.style.display = "none";
        return;
      }

      interimBar.style.display = "block";
      if (currentLanguage === "original") {
        interimBar.textContent = interimText;
      } else {
        interimBar.textContent = `${interimText} (original, translating…)`;
      }
    }

    function scrollToLiveIfNeeded(forceScroll) {
      if (forceScroll || !userScrolledUp) {
        requestAnimationFrame(() => {
          captionsScroll.scrollTop = captionsScroll.scrollHeight;
        });
        jumpToLiveButton.style.display = "none";
      } else {
        jumpToLiveButton.style.display = "block";
      }
    }

    captionsScroll.addEventListener("scroll", () => {
      const distanceFromBottom =
        captionsScroll.scrollHeight - captionsScroll.scrollTop - captionsScroll.clientHeight;
      userScrolledUp = distanceFromBottom > SCROLL_NEAR_BOTTOM_THRESHOLD_PX;
      jumpToLiveButton.style.display = userScrolledUp ? "block" : "none";
    });

    jumpToLiveButton.addEventListener("click", () => {
      userScrolledUp = false;
      scrollToLiveIfNeeded(true);
    });

    fontDecreaseButton.addEventListener("click", () => adjustFontSize(-2));
    fontIncreaseButton.addEventListener("click", () => adjustFontSize(2));

    downloadSrtButton.addEventListener("click", () => {
      location.href = exportUrl(currentRoomId, "srt", currentLanguage);
    });
    downloadVttButton.addEventListener("click", () => {
      location.href = exportUrl(currentRoomId, "vtt", currentLanguage);
    });
    downloadTxtButton.addEventListener("click", () => {
      location.href = exportUrl(currentRoomId, "txt", currentLanguage);
    });

    initializePickerView();
  </script>
</body>
</html>
