<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="index.title">Vox Libera — Live Captions</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 0;
    }

    header {
      position: sticky;
      top: 0;
      background: var(--color-background);
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--color-border);
      z-index: 10;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0;
    }

    .connection-indicator {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--color-text-dimmed);
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-text-dimmed);
    }

    .connection-dot--connected {
      background: var(--color-success);
    }

    .connection-dot--reconnecting {
      background: var(--color-warning);
    }

    .connection-dot--disconnected {
      background: var(--color-error);
    }

    .controls-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 0.6rem;
    }

    .font-size-controls {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-left: auto;
    }

    .font-size-controls button {
      padding: 0.3rem 0.6rem;
      font-weight: 700;
    }

    #picker-view {
      max-width: 480px;
      margin: 2rem auto;
      width: 100%;
    }

    #picker-view h1 {
      font-size: 1.4rem;
    }

    .picker-field {
      margin-bottom: 1rem;
    }

    .picker-field label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 600;
    }

    .picker-field select {
      width: 100%;
      padding: 0.6rem;
    }

    #captions-view {
      display: none;
      flex: 1;
      flex-direction: column;
    }

    #captions-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0 6rem 0;
    }

    .segment {
      margin-bottom: 1.1rem;
      line-height: 1.5;
      font-size: var(--caption-font-size, 20px);
    }

    .segment-time {
      display: block;
      font-size: 0.75rem;
      color: var(--color-text-dimmed);
      margin-bottom: 0.15rem;
    }

    .interim-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      padding: 0.85rem var(--side-gutter);
      font-size: var(--caption-font-size, 20px);
      color: var(--color-text-dimmed);
      font-style: italic;
      max-height: 30vh;
      overflow-y: auto;
    }

    .jump-to-live {
      position: fixed;
      bottom: 5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
    }

    .room-status-line {
      font-size: 0.85rem;
      color: var(--color-text-dimmed);
      margin-top: 0.35rem;
    }

    .cleared-notice {
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      color: var(--color-text-dimmed);
      font-size: 0.85rem;
      padding: 0.5rem 0;
      border-bottom: 1px dashed var(--color-text-dimmed);
      margin-bottom: 0.5rem;
    }

    .link-button {
      background: none;
      border: none;
      padding: 0;
      color: var(--color-accent);
      text-decoration: underline;
      cursor: pointer;
      font-size: inherit;
    }

    .download-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.6rem;
    }

    .download-row button {
      font-size: 0.85rem;
      padding: 0.35rem 0.7rem;
    }

    .change-room-link {
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div id="top-navigation"></div>

  <div id="picker-view">
    <h1>Vox Libera</h1>
    <p class="dimmed" data-i18n="index.pickRoomAndLanguage">Pick a room and a language to see live captions.</p>
    <div id="picker-error" class="banner-error" style="display: none"></div>

    <div class="picker-field" id="room-select-field">
      <label for="room-select" data-i18n="index.roomLabel">Room</label>
      <select id="room-select"></select>
    </div>
    <div class="choice-grid" id="room-choice-grid" hidden></div>

    <div class="picker-field" id="language-select-field">
      <label for="language-select" data-i18n="index.languageLabel">Language</label>
      <select id="language-select"></select>
    </div>
    <div class="choice-grid" id="language-choice-grid" hidden></div>

    <button id="join-button" class="primary" data-i18n="index.join">Join</button>
  </div>

  <div id="captions-view">
    <header>
      <div class="header-row">
        <p class="header-title" id="room-name-label" data-i18n="index.roomNameDefault">Room</p>
        <div class="connection-indicator">
          <span class="connection-dot" id="connection-dot"></span>
          <span id="connection-label" data-i18n="connection.connecting">Connecting…</span>
        </div>
      </div>
      <div class="room-status-line" id="room-status-line"></div>
      <div class="controls-row">
        <a class="change-room-link" href="index.html" data-i18n="index.changeRoom">Change room</a>
        <button id="clear-screen" type="button" data-i18n="index.clearScreen" data-i18n-title="index.clearScreenHint"
          title="Hide the captions shown so far. Only on this screen: nothing is deleted.">🧹 Clear screen</button>
        <div class="download-row">
          <button id="download-srt">SRT</button>
          <button id="download-vtt">VTT</button>
          <button id="download-txt">TXT</button>
        </div>
        <div class="font-size-controls">
          <button id="font-decrease" aria-label="Decrease font size" data-i18n-aria-label="index.decreaseFontSize">A-</button>
          <button id="font-increase" aria-label="Increase font size" data-i18n-aria-label="index.increaseFontSize">A+</button>
        </div>
      </div>
    </header>

    <div id="captions-scroll">
      <div id="cleared-notice" class="cleared-notice" style="display: none">
        <span data-i18n="index.screenCleared">Screen cleared. The full transcript is still in the downloads.</span>
        <button id="show-all-captions" type="button" class="link-button" data-i18n="index.showAllCaptions">Show everything again</button>
      </div>
      <div id="segments-container"></div>
    </div>

    <button id="jump-to-live" class="jump-to-live primary" style="display: none" data-i18n="index.jumpToLive">
      Jump to live
    </button>

    <div id="interim-bar" class="interim-bar" style="display: none"></div>
  </div>

  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script>
    const FONT_SIZE_STORAGE_KEY = "voxlibera.fontSizePx";
    const MIN_FONT_SIZE_PX = 14;
    const MAX_FONT_SIZE_PX = 40;
    const DEFAULT_FONT_SIZE_PX = 20;
    const SCROLL_NEAR_BOTTOM_THRESHOLD_PX = 80;

    const MAX_ROOMS_FOR_CHOICE_BUTTONS = 6;
    const MAX_LANGUAGES_FOR_CHOICE_BUTTONS = 6;

    renderTopNavigation("captions");

    const pickerView = document.getElementById("picker-view");
    const pickerError = document.getElementById("picker-error");
    const roomSelectField = document.getElementById("room-select-field");
    const roomSelect = document.getElementById("room-select");
    const roomChoiceGrid = document.getElementById("room-choice-grid");
    const languageSelectField = document.getElementById("language-select-field");
    const languageSelect = document.getElementById("language-select");
    const languageChoiceGrid = document.getElementById("language-choice-grid");
    const joinButton = document.getElementById("join-button");

    const captionsView = document.getElementById("captions-view");
    const roomNameLabel = document.getElementById("room-name-label");
    const roomStatusLine = document.getElementById("room-status-line");
    const connectionDot = document.getElementById("connection-dot");
    const connectionLabel = document.getElementById("connection-label");
    const captionsScroll = document.getElementById("captions-scroll");
    const segmentsContainer = document.getElementById("segments-container");
    const jumpToLiveButton = document.getElementById("jump-to-live");
    const interimBar = document.getElementById("interim-bar");
    const fontDecreaseButton = document.getElementById("font-decrease");
    const fontIncreaseButton = document.getElementById("font-increase");
    const clearScreenButton = document.getElementById("clear-screen");
    const clearedNotice = document.getElementById("cleared-notice");
    const showAllCaptionsButton = document.getElementById("show-all-captions");
    const downloadSrtButton = document.getElementById("download-srt");
    const downloadVttButton = document.getElementById("download-vtt");
    const downloadTxtButton = document.getElementById("download-txt");

    let userScrolledUp = false;
    let currentRoomId = null;
    let currentLanguage = "original";
    let currentRoomName = "";
    let captionsClient = null;
    let lastConnectionState = "connecting";
    let lastInterimText = "";
    let lastInterimLanguage = null;
    let lastRoomStatus = null;
    let pickerErrorVisible = false;

    function readStoredFontSizePx() {
      try {
        const storedValue = localStorage.getItem(FONT_SIZE_STORAGE_KEY);
        const parsedValue = storedValue ? parseInt(storedValue, 10) : DEFAULT_FONT_SIZE_PX;
        if (Number.isNaN(parsedValue)) {
          return DEFAULT_FONT_SIZE_PX;
        }
        return Math.min(MAX_FONT_SIZE_PX, Math.max(MIN_FONT_SIZE_PX, parsedValue));
      } catch (storageError) {
        return DEFAULT_FONT_SIZE_PX;
      }
    }

    function writeStoredFontSizePx(fontSizePx) {
      try {
        localStorage.setItem(FONT_SIZE_STORAGE_KEY, String(fontSizePx));
      } catch (storageError) {
        // Ignore storage failures (private browsing, quota, etc.)
      }
    }

    function applyFontSizePx(fontSizePx) {
      document.documentElement.style.setProperty("--caption-font-size", `${fontSizePx}px`);
    }

    function adjustFontSize(deltaPx) {
      const currentFontSizePx = readStoredFontSizePx();
      const nextFontSizePx = Math.min(
        MAX_FONT_SIZE_PX,
        Math.max(MIN_FONT_SIZE_PX, currentFontSizePx + deltaPx)
      );
      writeStoredFontSizePx(nextFontSizePx);
      applyFontSizePx(nextFontSizePx);
    }

    function getQueryParameters() {
      return new URLSearchParams(location.search);
    }

    function setQueryParameters(roomId, languageCode) {
      const searchParameters = new URLSearchParams();
      searchParameters.set("room", roomId);
      searchParameters.set("lang", languageCode);
      history.replaceState(null, "", `?${searchParameters.toString()}`);
    }

    async function initializePickerView() {
      let roomsData;
      try {
        roomsData = await fetchRooms();
      } catch (fetchError) {
        pickerErrorVisible = true;
        pickerError.textContent = t("common.couldNotReachServer");
        pickerError.style.display = "block";
        return;
      }

      roomSelect.innerHTML = "";
      for (const room of roomsData.rooms) {
        const optionElement = document.createElement("option");
        optionElement.value = room.id;
        optionElement.textContent = room.name;
        roomSelect.appendChild(optionElement);
      }

      languageSelect.innerHTML = "";
      for (const languageCode of roomsData.languages) {
        const optionElement = document.createElement("option");
        optionElement.value = languageCode;
        optionElement.textContent = languageLabel(languageCode);
        languageSelect.appendChild(optionElement);
      }

      const queryParameters = getQueryParameters();
      const requestedRoomId = queryParameters.get("room");
      const requestedLanguage = queryParameters.get("lang");

      if (requestedRoomId && roomsData.rooms.some((room) => room.id === requestedRoomId)) {
        roomSelect.value = requestedRoomId;
      }
      if (requestedLanguage && roomsData.languages.includes(requestedLanguage)) {
        languageSelect.value = requestedLanguage;
      }

      buildRoomChoiceButtons(roomsData.rooms);
      buildLanguageChoiceButtons(roomsData.languages);

      if (requestedRoomId && roomsData.rooms.some((room) => room.id === requestedRoomId)) {
        const selectedRoom = roomsData.rooms.find((room) => room.id === requestedRoomId);
        joinRoom(requestedRoomId, selectedRoom.name, languageSelect.value);
        return;
      }
    }

    function buildRoomChoiceButtons(rooms) {
      if (rooms.length === 0 || rooms.length > MAX_ROOMS_FOR_CHOICE_BUTTONS) {
        roomChoiceGrid.hidden = true;
        roomSelectField.hidden = false;
        return;
      }

      roomSelectField.hidden = true;
      roomChoiceGrid.hidden = false;
      roomChoiceGrid.innerHTML = "";
      for (const room of rooms) {
        const roomButton = document.createElement("button");
        roomButton.type = "button";
        roomButton.className = "choice-button";
        if (room.id === roomSelect.value) {
          roomButton.classList.add("choice-button--selected");
        }
        roomButton.textContent = room.name;
        roomButton.addEventListener("click", () => {
          roomSelect.value = room.id;
          markSelectedChoiceButton(roomChoiceGrid, roomButton);
        });
        roomChoiceGrid.appendChild(roomButton);
      }
    }

    function buildLanguageChoiceButtons(languages) {
      if (languages.length === 0 || languages.length > MAX_LANGUAGES_FOR_CHOICE_BUTTONS) {
        languageChoiceGrid.hidden = true;
        languageSelectField.hidden = false;
        return;
      }

      languageSelectField.hidden = true;
      languageChoiceGrid.hidden = false;
      languageChoiceGrid.innerHTML = "";
      for (const languageCode of languages) {
        const languageButton = document.createElement("button");
        languageButton.type = "button";
        languageButton.className = "choice-button";
        if (languageCode === languageSelect.value) {
          languageButton.classList.add("choice-button--selected");
        }
        languageButton.textContent = languageLabel(languageCode);
        languageButton.addEventListener("click", () => {
          languageSelect.value = languageCode;
          markSelectedChoiceButton(languageChoiceGrid, languageButton);
        });
        languageChoiceGrid.appendChild(languageButton);
      }
    }

    function markSelectedChoiceButton(gridElement, selectedButtonElement) {
      for (const buttonElement of gridElement.querySelectorAll(".choice-button")) {
        buttonElement.classList.toggle("choice-button--selected", buttonElement === selectedButtonElement);
      }
    }

    joinButton.addEventListener("click", () => {
      const selectedRoomId = roomSelect.value;
      const selectedRoomName = roomSelect.options[roomSelect.selectedIndex].textContent;
      const selectedLanguage = languageSelect.value;
      joinRoom(selectedRoomId, selectedRoomName, selectedLanguage);
    });

    function joinRoom(roomId, roomName, languageCode) {
      currentRoomId = roomId;
      currentRoomName = roomName;
      currentLanguage = languageCode;
      setQueryParameters(roomId, languageCode);

      pickerView.style.display = "none";
      captionsView.style.display = "flex";
      roomNameLabel.textContent = `${roomName} — ${languageLabel(languageCode)}`;

      applyFontSizePx(readStoredFontSizePx());
      loadClearedMark();

      captionsClient = new CaptionsClient(roomId);
      captionsClient.onConnectionChanged = handleConnectionChanged;
      captionsClient.onHistoryReplaced = handleHistoryReplaced;
      captionsClient.onSegmentUpserted = handleSegmentUpserted;
      captionsClient.onInterimChanged = handleInterimChanged;
      captionsClient.onStatusChanged = handleStatusChanged;
      captionsClient.connect();
    }

    function handleConnectionChanged(connectionState) {
      lastConnectionState = connectionState;
      connectionDot.className = `connection-dot connection-dot--${
        connectionState === "connected" ? "connected" : connectionState === "reconnecting" ? "reconnecting" : "disconnected"
      }`;
      connectionLabel.textContent = t(`connection.${connectionState}`) || connectionState;
    }

    function handleStatusChanged(roomStatus) {
      lastRoomStatus = roomStatus;
      roomStatusLine.textContent = t("index.roomStatus", { status: statusLabel(roomStatus) });
    }

    // "Clear screen" hides segments up to this id, only for this viewer. The server keeps everything.
    let clearedUpToSegmentId = 0;
    let highestSegmentIdSeen = 0;
    const allSegmentsById = new Map();

    function clearedStorageKey() {
      return `voxlibera.clearedUpTo.${currentRoomId}`;
    }

    function loadClearedMark() {
      try {
        clearedUpToSegmentId = parseInt(sessionStorage.getItem(clearedStorageKey()), 10) || 0;
      } catch (storageError) {
        clearedUpToSegmentId = 0;
      }
    }

    function saveClearedMark() {
      try {
        sessionStorage.setItem(clearedStorageKey(), String(clearedUpToSegmentId));
      } catch (storageError) {
        // Storage unavailable (private mode): clearing still works until reload.
      }
    }

    function isCleared(segment) {
      return segment.id <= clearedUpToSegmentId;
    }

    function updateClearedNotice() {
      clearedNotice.style.display = clearedUpToSegmentId > 0 ? "flex" : "none";
    }

    function clearScreen() {
      clearedUpToSegmentId = highestSegmentIdSeen;
      saveClearedMark();
      segmentsContainer.innerHTML = "";
      updateClearedNotice();
    }

    function renderVisibleSegments() {
      segmentsContainer.innerHTML = "";
      const orderedSegments = [...allSegmentsById.values()].sort((first, second) => first.id - second.id);
      for (const segment of orderedSegments) {
        if (!isCleared(segment)) {
          segmentsContainer.appendChild(buildSegmentElement(segment));
        }
      }
    }

    function showAllCaptions() {
      clearedUpToSegmentId = 0;
      saveClearedMark();
      renderVisibleSegments();
      updateClearedNotice();
      scrollToLiveIfNeeded(true);
    }

    function handleHistoryReplaced(orderedSegments, roomStatus) {
      allSegmentsById.clear();
      for (const segment of orderedSegments) {
        allSegmentsById.set(segment.id, segment);
      }
      highestSegmentIdSeen = orderedSegments.reduce((highest, segment) => Math.max(highest, segment.id), 0);
      if (highestSegmentIdSeen < clearedUpToSegmentId) {
        // Production reset the room transcript: ids start over, so the old mark no longer applies.
        clearedUpToSegmentId = 0;
        saveClearedMark();
      }
      renderVisibleSegments();
      updateClearedNotice();
      handleStatusChanged(roomStatus);
      scrollToLiveIfNeeded(true);
    }

    function handleSegmentUpserted(segment) {
      allSegmentsById.set(segment.id, segment);
      highestSegmentIdSeen = Math.max(highestSegmentIdSeen, segment.id);
      if (isCleared(segment)) {
        return;  // e.g. a late translation of a sentence the viewer already cleared
      }
      const existingElement = segmentsContainer.querySelector(
        `[data-segment-id="${segment.id}"]`
      );
      const newElement = buildSegmentElement(segment);
      if (existingElement) {
        existingElement.replaceWith(newElement);
      } else {
        segmentsContainer.appendChild(newElement);
      }
      scrollToLiveIfNeeded(false);
    }

    function buildSegmentElement(segment) {
      const segmentElement = document.createElement("div");
      segmentElement.className = "segment";
      segmentElement.dataset.segmentId = String(segment.id);
      // An empty original means the final transcript merged this sentence into a previous one.
      segmentElement.hidden = !segment.original;

      const timeElement = document.createElement("span");
      timeElement.className = "segment-time";
      timeElement.textContent = `${formatDuration(segment.start)} — ${formatDuration(segment.end)}`;
      segmentElement.appendChild(timeElement);

      const textElement = document.createElement("span");

      if (currentLanguage === "original") {
        textElement.textContent = segment.original;
      } else {
        const translatedText = segment.translations ? segment.translations[currentLanguage] : null;
        if (translatedText) {
          textElement.textContent = translatedText;
        } else {
          textElement.textContent = segment.original;
          textElement.className = "dimmed";
        }
      }

      segmentElement.appendChild(textElement);
      return segmentElement;
    }

    function handleInterimChanged(interimText, interimLanguage) {
      lastInterimText = interimText || "";
      lastInterimLanguage = interimLanguage;
      if (!interimText) {
        interimBar.style.display = "none";
        return;
      }

      interimBar.style.display = "block";
      if (currentLanguage === "original") {
        interimBar.textContent = interimText;
      } else {
        interimBar.textContent = t("index.interimTranslating", { text: interimText });
      }
    }

    function scrollToLiveIfNeeded(forceScroll) {
      if (forceScroll || !userScrolledUp) {
        requestAnimationFrame(() => {
          captionsScroll.scrollTop = captionsScroll.scrollHeight;
        });
        jumpToLiveButton.style.display = "none";
      } else {
        jumpToLiveButton.style.display = "block";
      }
    }

    captionsScroll.addEventListener("scroll", () => {
      const distanceFromBottom =
        captionsScroll.scrollHeight - captionsScroll.scrollTop - captionsScroll.clientHeight;
      userScrolledUp = distanceFromBottom > SCROLL_NEAR_BOTTOM_THRESHOLD_PX;
      jumpToLiveButton.style.display = userScrolledUp ? "block" : "none";
    });

    jumpToLiveButton.addEventListener("click", () => {
      userScrolledUp = false;
      scrollToLiveIfNeeded(true);
    });

    fontDecreaseButton.addEventListener("click", () => adjustFontSize(-2));
    fontIncreaseButton.addEventListener("click", () => adjustFontSize(2));

    clearScreenButton.addEventListener("click", clearScreen);
    showAllCaptionsButton.addEventListener("click", showAllCaptions);

    downloadSrtButton.addEventListener("click", () => {
      location.href = exportUrl(currentRoomId, "srt", currentLanguage);
    });
    downloadVttButton.addEventListener("click", () => {
      location.href = exportUrl(currentRoomId, "vtt", currentLanguage);
    });
    downloadTxtButton.addEventListener("click", () => {
      location.href = exportUrl(currentRoomId, "txt", currentLanguage);
    });

    window.onUiLanguageChanged = () => {
      if (pickerErrorVisible) {
        pickerError.textContent = t("common.couldNotReachServer");
      }
      if (lastRoomStatus) {
        handleStatusChanged(lastRoomStatus);
      }
      handleConnectionChanged(lastConnectionState);
      handleInterimChanged(lastInterimText, lastInterimLanguage);
    };

    initializePickerView();
  </script>
</body>
</html>
