<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="dashboard.title">Vox Libera — Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      padding-top: 0;
      padding-bottom: 2rem;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.25rem;
      margin-top: 1rem;
    }

    .page-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .subtitle {
      color: var(--color-text-dimmed);
      margin-top: 0;
      margin-bottom: 1rem;
    }

    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1rem;
    }

    .room-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .room-card-title {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .metrics-list {
      list-style: none;
      margin: 0.75rem 0;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem 1rem;
      font-size: 0.9rem;
    }

    .metrics-list dt {
      color: var(--color-text-dimmed);
      display: inline;
    }

    .metrics-list dd {
      display: inline;
      margin: 0;
      float: right;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
    }

    .last-error {
      color: var(--color-error);
      font-size: 0.85rem;
      margin: 0.35rem 0;
      word-break: break-word;
    }

    .room-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
      align-items: center;
    }

    .room-actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .simulate-row select {
      max-width: 160px;
    }

    .room-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
      align-items: center;
    }

    .download-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.6rem;
      align-items: center;
    }

    .download-row select {
      max-width: 140px;
    }

    .card-error {
      color: var(--color-error);
      font-size: 0.85rem;
      margin-top: 0.6rem;
    }

    .copy-feedback {
      color: var(--color-success);
      font-size: 0.85rem;
    }

    .total-cost-row {
      margin-top: 1rem;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .empty-state {
      color: var(--color-text-dimmed);
    }
  </style>
</head>
<body>
  <div id="top-navigation"></div>

  <div class="page-header-row">
    <div>
      <h1 data-i18n="dashboard.heading">Dashboard</h1>
      <p class="subtitle" data-i18n="dashboard.subtitle">Live monitoring, refreshed every 2 seconds.</p>
    </div>
    <button id="admin-key-button" type="button" data-i18n="common.adminKeyButton">🔑 Admin key</button>
  </div>

  <div id="error-banner" class="banner-error" style="display: none"></div>

  <div id="rooms-grid" class="rooms-grid"></div>

  <div id="total-cost-row" class="total-cost-row"></div>

  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script>
    const POLL_INTERVAL_MS = 2000;

    renderTopNavigation("dashboard");
    setupAdminKeyButton(document.getElementById("admin-key-button"));

    const errorBanner = document.getElementById("error-banner");
    const roomsGrid = document.getElementById("rooms-grid");
    const totalCostRow = document.getElementById("total-cost-row");

    let cachedSamples = [];
    const downloadFormatByRoomId = new Map();
    const downloadLanguageByRoomId = new Map();
    const cardErrorByRoomId = new Map();
    let lastRoomsData = null;
    let errorBannerVisible = false;

    async function loadSamplesOnce() {
      try {
        const samplesData = await fetchSamples();
        cachedSamples = samplesData.samples || [];
      } catch (fetchError) {
        cachedSamples = [];
      }
    }

    async function pollRooms() {
      let roomsData;
      try {
        roomsData = await fetchRooms();
      } catch (fetchError) {
        errorBannerVisible = true;
        errorBanner.textContent = t("dashboard.couldNotReachServerRetrying");
        errorBanner.style.display = "block";
        return;
      }
      errorBannerVisible = false;
      errorBanner.style.display = "none";
      lastRoomsData = roomsData;
      renderRooms(roomsData.rooms, roomsData.languages || ["original"]);
    }

    function renderRooms(rooms, languages) {
      roomsGrid.innerHTML = "";

      if (rooms.length === 0) {
        const emptyElement = document.createElement("p");
        emptyElement.className = "empty-state";
        emptyElement.textContent = t("dashboard.noRoomsConfigured");
        roomsGrid.appendChild(emptyElement);
        totalCostRow.textContent = "";
        return;
      }

      let totalCostUsd = 0;
      for (const room of rooms) {
        totalCostUsd += room.estimated_cost_usd || 0;
        roomsGrid.appendChild(buildRoomCard(room, languages));
      }
      totalCostRow.textContent = t("dashboard.totalEstimatedCost", { cost: formatCost(totalCostUsd) });
    }

    function buildRoomCard(room, languages) {
      const cardElement = document.createElement("div");
      cardElement.className = "card";

      const headerElement = document.createElement("div");
      headerElement.className = "room-card-header";

      const titleElement = document.createElement("span");
      titleElement.className = "room-card-title";
      titleElement.textContent = room.name;
      headerElement.appendChild(titleElement);

      const statusBadgeElement = document.createElement("span");
      statusBadgeElement.className = `status-badge status-badge--${room.status}`;
      statusBadgeElement.textContent = statusLabel(room.status);
      headerElement.appendChild(statusBadgeElement);

      cardElement.appendChild(headerElement);

      const metricsListElement = document.createElement("dl");
      metricsListElement.className = "metrics-list";
      appendMetric(
        metricsListElement,
        t("dashboard.source"),
        room.source_connected
          ? t("dashboard.connectedKind", { kind: room.source_kind || t("dashboard.unknownKind") })
          : t("dashboard.disconnected")
      );
      appendMetric(metricsListElement, t("dashboard.audioTime"), formatDuration(room.audio_seconds));
      appendMetric(metricsListElement, t("dashboard.segments"), String(room.segments));
      appendMetric(metricsListElement, t("dashboard.subscribers"), String(room.subscribers));
      appendMetric(metricsListElement, t("dashboard.sessionsOpened"), String(room.sessions_opened));
      appendMetric(metricsListElement, t("dashboard.rotations"), String(room.rotations));
      appendMetric(metricsListElement, t("dashboard.errors"), String(room.errors));
      appendMetric(metricsListElement, t("dashboard.captionLag"), `${room.caption_lag_seconds.toFixed(1)}s`);
      appendMetric(metricsListElement, t("dashboard.translationLatency"), `${room.translation_latency_ms}ms`);
      appendMetric(metricsListElement, t("dashboard.estimatedCost"), formatCost(room.estimated_cost_usd));
      cardElement.appendChild(metricsListElement);

      if (room.last_error) {
        const lastErrorElement = document.createElement("p");
        lastErrorElement.className = "last-error";
        lastErrorElement.textContent = t("dashboard.lastError", { error: room.last_error });
        cardElement.appendChild(lastErrorElement);
      }

      cardElement.appendChild(buildSimulateRow(room));
      cardElement.appendChild(buildActionsRow(room));
      cardElement.appendChild(buildLinksRow(room));
      cardElement.appendChild(buildDownloadRow(room, languages));

      const existingCardError = cardErrorByRoomId.get(room.id);
      if (existingCardError) {
        const cardErrorElement = document.createElement("p");
        cardErrorElement.className = "card-error";
        cardErrorElement.textContent = existingCardError;
        cardElement.appendChild(cardErrorElement);
      }

      return cardElement;
    }

    function appendMetric(metricsListElement, label, value) {
      const rowElement = document.createElement("div");
      rowElement.className = "metric-row";

      const termElement = document.createElement("dt");
      termElement.textContent = label;

      const valueElement = document.createElement("dd");
      valueElement.textContent = value;

      rowElement.appendChild(termElement);
      rowElement.appendChild(valueElement);
      metricsListElement.appendChild(rowElement);
    }

    function setCardError(roomId, message) {
      if (message) {
        cardErrorByRoomId.set(roomId, message);
      } else {
        cardErrorByRoomId.delete(roomId);
      }
    }

    function buildSimulateRow(room) {
      const rowElement = document.createElement("div");
      rowElement.className = "room-actions-row simulate-row";

      const sampleSelectElement = document.createElement("select");
      for (const sampleFileName of cachedSamples) {
        const optionElement = document.createElement("option");
        optionElement.value = sampleFileName;
        optionElement.textContent = sampleFileName;
        sampleSelectElement.appendChild(optionElement);
      }
      rowElement.appendChild(sampleSelectElement);

      const simulateButtonElement = document.createElement("button");
      simulateButtonElement.className = "action-button";
      simulateButtonElement.textContent = t("dashboard.playSample");
      simulateButtonElement.addEventListener("click", async () => {
        simulateButtonElement.disabled = true;
        setCardError(room.id, null);
        try {
          await simulateRoom(room.id, sampleSelectElement.value);
          await pollRooms();
        } catch (simulateError) {
          setCardError(room.id, t("dashboard.failedToStartSimulation", { message: simulateError.message }));
          await pollRooms();
        } finally {
          simulateButtonElement.disabled = false;
        }
      });
      rowElement.appendChild(simulateButtonElement);

      return rowElement;
    }

    function buildActionsRow(room) {
      const actionsElement = document.createElement("div");
      actionsElement.className = "room-actions";

      const broadcastLinkElement = document.createElement("a");
      broadcastLinkElement.className = "action-button";
      broadcastLinkElement.href = `broadcast.html?room=${encodeURIComponent(room.id)}`;
      broadcastLinkElement.textContent = t("dashboard.broadcast");
      actionsElement.appendChild(broadcastLinkElement);

      const stopButtonElement = document.createElement("button");
      stopButtonElement.className = "action-button";
      stopButtonElement.textContent = t("dashboard.stop");
      stopButtonElement.disabled = !room.source_connected;
      stopButtonElement.addEventListener("click", async () => {
        stopButtonElement.disabled = true;
        setCardError(room.id, null);
        try {
          await stopRoom(room.id);
          await pollRooms();
        } catch (stopError) {
          setCardError(room.id, t("dashboard.failedToStop", { message: stopError.message }));
          await pollRooms();
        }
      });
      actionsElement.appendChild(stopButtonElement);

      const clearButtonElement = document.createElement("button");
      clearButtonElement.className = "action-button";
      clearButtonElement.textContent = t("dashboard.clearTranscript");
      clearButtonElement.disabled = room.source_connected;
      clearButtonElement.addEventListener("click", async () => {
        const confirmed = window.confirm(t("dashboard.confirmDeleteTranscript"));
        if (!confirmed) {
          return;
        }
        clearButtonElement.disabled = true;
        setCardError(room.id, null);
        try {
          await resetRoom(room.id);
          await pollRooms();
        } catch (resetError) {
          setCardError(room.id, t("dashboard.failedToClearTranscript", { message: resetError.message }));
          await pollRooms();
        }
      });
      actionsElement.appendChild(clearButtonElement);

      return actionsElement;
    }

    function buildLinksRow(room) {
      const linksElement = document.createElement("div");
      linksElement.className = "room-links";

      const openCaptionsLink = document.createElement("a");
      openCaptionsLink.className = "action-button";
      openCaptionsLink.href = `index.html?room=${encodeURIComponent(room.id)}&lang=original`;
      openCaptionsLink.target = "_blank";
      openCaptionsLink.textContent = t("dashboard.openCaptions");
      linksElement.appendChild(openCaptionsLink);

      linksElement.appendChild(
        buildCopyButton("dashboard.copyAudienceLink", `${location.origin}/index.html?room=${encodeURIComponent(room.id)}&lang=original`)
      );
      linksElement.appendChild(
        buildCopyButton("dashboard.copyObsLink", `${location.origin}/obs.html?room=${encodeURIComponent(room.id)}&lang=es`)
      );

      return linksElement;
    }

    function buildCopyButton(labelKey, urlToCopy) {
      const wrapperElement = document.createElement("span");

      const buttonElement = document.createElement("button");
      buttonElement.className = "action-button";
      buttonElement.textContent = t(labelKey);
      wrapperElement.appendChild(buttonElement);

      const feedbackElement = document.createElement("span");
      feedbackElement.className = "copy-feedback";
      feedbackElement.textContent = t("common.copied");
      feedbackElement.style.display = "none";
      wrapperElement.appendChild(feedbackElement);

      buttonElement.addEventListener("click", () => {
        navigator.clipboard
          .writeText(urlToCopy)
          .then(() => {
            feedbackElement.style.display = "inline";
            setTimeout(() => {
              feedbackElement.style.display = "none";
            }, 1500);
          })
          .catch(() => {});
      });

      return wrapperElement;
    }

    function buildDownloadRow(room, languages) {
      const rowElement = document.createElement("div");
      rowElement.className = "download-row";

      const languageSelectElement = document.createElement("select");
      for (const languageCode of languages) {
        const optionElement = document.createElement("option");
        optionElement.value = languageCode;
        optionElement.textContent = languageLabel(languageCode);
        languageSelectElement.appendChild(optionElement);
      }
      languageSelectElement.value = downloadLanguageByRoomId.get(room.id) || "original";
      languageSelectElement.addEventListener("change", () => {
        downloadLanguageByRoomId.set(room.id, languageSelectElement.value);
      });
      rowElement.appendChild(languageSelectElement);

      rowElement.appendChild(buildDownloadButton("dashboard.downloadSrt", room, "srt", languageSelectElement));
      rowElement.appendChild(buildDownloadButton("dashboard.downloadVtt", room, "vtt", languageSelectElement));
      rowElement.appendChild(buildDownloadButton("dashboard.downloadTxt", room, "txt", languageSelectElement));

      return rowElement;
    }

    function buildDownloadButton(labelKey, room, format, languageSelectElement) {
      const buttonElement = document.createElement("button");
      buttonElement.className = "action-button";
      buttonElement.textContent = t(labelKey);
      buttonElement.addEventListener("click", () => {
        window.location.href = exportUrl(room.id, format, languageSelectElement.value);
      });
      return buttonElement;
    }

    async function initializeDashboard() {
      await loadSamplesOnce();
      await pollRooms();
      setInterval(pollRooms, POLL_INTERVAL_MS);
    }

    window.onUiLanguageChanged = () => {
      if (errorBannerVisible) {
        errorBanner.textContent = t("dashboard.couldNotReachServerRetrying");
      }
      if (lastRoomsData) {
        renderRooms(lastRoomsData.rooms, lastRoomsData.languages || ["original"]);
      }
    };

    initializeDashboard();
  </script>
</body>
</html>
